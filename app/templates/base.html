<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101828">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
<header class="navbar">
    <a class="brand" href="/">
        <span class="brand-icon">P</span>
        <span>PocketSmart <span class="brand-accent">AI</span></span>
    </a>

    <nav class="nav-links">
        {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/home">Home</a>
            <a href="/party">Party</a>
            <a href="/jewelry">Jewelry</a>
            <form action="/logout" method="post" class="inline-form">
                <button class="nav-logout" type="submit">Log out</button>
            </form>
        {% else %}
            <a href="/login">Log in</a>
            <a class="button button-small" href="/register">Get started</a>
        {% endif %}
    </nav>
</header>

<main class="page-container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>© 2026 PocketSmart AI · Plan thoughtfully. Spend wisely.</p>
</footer>
</body>
</html>
